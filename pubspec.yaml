name: geofit
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:      
    sdk: flutter
  intl: ^0.20.2             
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/geofitlogofinal.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/geofitlogofinal.png"

flutter:
  generate: true             
  uses-material-design: true
  assets:
    - assets/images/